<svg xmlns="http://www.w3.org/2000/svg" width="1181" height="205" viewBox="0 0 1181 205" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<!-- xbuf / proxy 的一个方向：可信端自持状态，不可信端只报告 -->
<rect x="0" y="0" width="1181" height="205" fill="#FFFFFF"/>

<!-- 实时线程 -->
<rect x="2" y="81" width="128" height="70" rx="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.6"/>
<text x="66" y="121" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">实时线程</text>

<line x1="139" y1="116" x2="271" y2="116" stroke="#555555" stroke-width="1.3"/>
<polygon points="130,116 139,111.5 139,120.5" fill="#555555"/>
<polygon points="280,116 271,111.5 271,120.5" fill="#555555"/>
<text x="205" y="106" font-size="12" font-family="Consolas, Menlo, Courier New, monospace" fill="#000000" text-anchor="middle">oob_read/write</text>
<text x="205" y="135" font-size="12" fill="#666666" text-anchor="middle">拷贝本线程缓冲区</text>

<!-- 可信端 -->
<rect x="280" y="36" width="290" height="160" rx="8" fill="#E3EEF7" stroke="#0072B2" stroke-width="1.6"/>
<text x="300" y="64" font-size="15" font-weight="bold" fill="#0072B2">可信端（Z）</text>
<circle cx="305" cy="92" r="2.5" fill="#0072B2"/>
<text x="315" y="97" font-size="13.5" fill="#000000">本端读写下标、字节计数</text>
<circle cx="305" cy="120" r="2.5" fill="#0072B2"/>
<text x="315" y="125" font-size="13.5" fill="#000000">等待对象（EVL flag）</text>
<circle cx="305" cy="148" r="2.5" fill="#0072B2"/>
<text x="315" y="153" font-size="13.5" fill="#000000">积压告警、超时告警</text>

<!-- 共享缓冲区 -->
<rect x="640" y="84" width="170" height="64" rx="4" fill="#EDEDED" stroke="#777777" stroke-width="1.2"/>
<text x="725" y="111" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">共享 bufmem</text>
<text x="725" y="133" font-size="12.5" fill="#555555" text-anchor="middle">内容不可信</text>

<line x1="579" y1="116" x2="631" y2="116" stroke="#555555" stroke-width="1.3"/>
<polygon points="570,116 579,111.5 579,120.5" fill="#555555"/>
<polygon points="640,116 631,111.5 631,120.5" fill="#555555"/>
<line x1="819" y1="116" x2="871" y2="116" stroke="#555555" stroke-width="1.3"/>
<polygon points="810,116 819,111.5 819,120.5" fill="#555555"/>
<polygon points="880,116 871,111.5 871,120.5" fill="#555555"/>

<!-- 不可信端 -->
<rect x="880" y="36" width="298" height="160" rx="8" fill="#FBEBE1" stroke="#D55E00" stroke-width="1.6"/>
<text x="900" y="64" font-size="15" font-weight="bold" fill="#D55E00">不可信端（z）</text>
<circle cx="905" cy="92" r="2.5" fill="#D55E00"/>
<text x="915" y="97" font-size="13.5" fill="#000000">xbuf：inband read / write</text>
<circle cx="905" cy="120" r="2.5" fill="#D55E00"/>
<text x="915" y="125" font-size="13.5" fill="#000000">proxy：转发者 kernel_read / write</text>
<text x="915" y="153" font-size="13.5" fill="#000000">→ 目标文件的 f_op</text>
<text x="915" y="178" font-size="12.5" fill="#555555">（tty 驱动、ext4、pipe…）</text>

<!-- 报告：z → Z -->
<line x1="880" y1="56" x2="579" y2="56" stroke="#D55E00" stroke-width="1.5"/>
<polygon points="570,56 579,51.5 579,60.5" fill="#D55E00"/>
<text x="725" y="46" font-size="12.5" fill="#D55E00" text-anchor="middle">报告“读/写了 n 字节”，可信端截断后更新</text>

<!-- 通知：Z → z -->
<line x1="570" y1="176" x2="871" y2="176" stroke="#0072B2" stroke-width="1.5"/>
<polygon points="880,176 871,171.5 871,180.5" fill="#0072B2"/>
<text x="725" y="196" font-size="12.5" fill="#0072B2" text-anchor="middle">通知：可信端只记录，z 收到合成中断后来取</text>
</svg>
