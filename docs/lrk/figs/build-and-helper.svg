<!-- ================= 图例 ================= -->
<line class="div" x1="30" y1="534" x2="750" y2="534"/>
<rect class="pg" x="30" y="548" width="30" height="14" rx="7"/><text class="cap" x="66" y="559">局部符号 t</text>
<rect class="pb" x="140" y="548" width="30" height="14" rx="7"/><text class="cap" x="176" y="559">全局符号 T（插座）</text>
<use href="#plug" transform="translate(290,555)"/><text class="cap" x="314" y="559">未定义符号 U（插头）</text>
<rect class="segx" x="430" y="548" width="22" height="14"/><text class="cap" x="458" y="559">会被宿主特殊处理的段</text>
<circle cx="604" cy="555" r="7.5" fill="#0072B2"/><text x="604" y="558.8" text-anchor="middle" fill="#fff" font-weight="600" font-size="10">1</text><text class="cap" x="617" y="559">helper 迁移的关键步骤</text>
<path class="cf" d="M30,582 L58,582"/><text class="cap" x="64" y="586">编译</text>
<path class="cfg" d="M120,582 L148,582"/><text class="cap" x="154" y="586">段原名落位</text>
<path class="cfb" d="M240,582 L268,582"/><text class="cap" x="274" y="586">改名后落位 / 调用</text>
<path class="cfr" d="M390,582 L418,582"/><text class="cap" x="424" y="586">不改名会落入的位置</text>
<rect class="lkl" x="560" y="575" width="22" height="13"/><text class="cap" x="588" y="586">来自 LKL 的内容</text>
</svg>
